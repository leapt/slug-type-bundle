name: Continuous integration

on:
  pull_request:
    branches: ['1.x']
  push:
    branches: ['1.x']

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }} - Symfony ${{ matrix.symfony-version }})
    runs-on: ubuntu-24.04
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony-version }}

    strategy:
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        symfony-version:
          - '6.4.*'
          - '7.4.*'
        include:
          - php-version: '8.4'
            symfony-version: '8.0.*'
          - php-version: '8.5'
            symfony-version: '8.0.*'
          - php-version: '8.5'
            symfony-version: '8.1.*@dev'
            continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install PHP with pcov
        uses: shivammathur/setup-php@v2
        with:
          coverage: pcov
          php-version: ${{ matrix.php-version }}
          tools: flex

      - name: Configure Composer minimum-stability for dev versions
        if: contains(matrix.symfony-version, 'dev')
        run: composer config minimum-stability dev

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPUnit
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.php-version == '8.2' && matrix.symfony-version == '6.4.*'
